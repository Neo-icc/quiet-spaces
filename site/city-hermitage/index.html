<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市山隐</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1416;color:#c1d0c4;font:15px 'Noto Serif SC','Songti SC',serif}main{position:relative;overflow:hidden;height:100dvh;min-height:540px;background:radial-gradient(ellipse at 50% 60%,#30463c,#0e1416 78%)}.mount{position:absolute;inset:20% -20% 15%;background:#243c33;clip-path:polygon(0 65%,14% 42%,28% 60%,45% 17%,65% 62%,80% 32%,100% 67%,100% 100%,0 100%)}.mount.two{inset:39% -20% 0;background:#192c26;clip-path:polygon(0 55%,20% 25%,40% 60%,60% 30%,80% 54%,100% 20%,100% 100%,0 100%)}.mist{position:absolute;inset:20% -20%;background:radial-gradient(ellipse,#a1c3a019,transparent 70%);filter:blur(22px);animation:drift 24s ease-in-out infinite alternate}.floor{position:absolute;bottom:-17%;left:-20%;width:140%;height:45%;border-radius:50%;background:radial-gradient(ellipse at top,#3f5b4e,#10211a 72%)}.mat{position:absolute;bottom:20%;left:calc(50% - 45px);width:90px;height:23px;border-radius:50%;background:#536b52;border:1px solid #6c8480}.lamp{position:absolute;bottom:29%;right:22%;height:24px;width:13px;border:1px solid #6c8480}.lamp.on{background:#e8b27d;box-shadow:0 0 24px 7px #e8b27d66,0 0 90px 30px #e8b27d22}.fog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}header{position:absolute;top:18px;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;gap:10px}nav{display:flex;gap:8px}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;padding:7px}nav button{font-size:12px}.poem{position:absolute;top:31%;width:100%;text-align:center;line-height:2.4;letter-spacing:.12em}.controls{position:absolute;bottom:5%;right:5%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:end}.controls button,.micro button{border-bottom:1px solid #6c8480;font-size:13px}.micro{position:absolute;bottom:24%;right:5%;display:none;gap:8px}.micro.visible{display:flex}.panel{position:absolute;top:23%;left:8%;right:8%;max-width:600px;line-height:2.2;display:none}.panel.visible{display:block}.tree{position:absolute;bottom:19%;font-size:30px;color:#4d755b}.hint{position:absolute;bottom:38%;width:100%;text-align:center;font-size:13px}.rip{position:absolute;bottom:13%;left:20%;border:1px solid #b4c6bb;border-radius:50%;width:12px;height:12px;animation:rip 1.6s forwards}.leaf{position:absolute;bottom:20%;left:72%;width:75px;height:18px;border:1px solid #a0b5a044;border-radius:50%}.sitter{position:absolute;bottom:21%;left:calc(50% - 8px);height:27px;width:16px;border-radius:50%;background:#14201c}.breath{position:absolute;bottom:18%;left:calc(50% - 50px);width:100px;height:100px;background:radial-gradient(circle,#a1b7a025,transparent 70%);animation:breathe 10s infinite}.plant{position:absolute;bottom:40%;left:10%;right:10%;text-align:center;display:none}.plant.visible{display:block}@keyframes drift{to{transform:translateX(12%)}}@keyframes breathe{50%{transform:scale(1.25);opacity:.4}}@keyframes rip{to{transform:scale(14,6);opacity:0}}@media(max-width:420px){header{left:3%;right:3%}header strong{font-size:12px}nav{gap:0}nav button{font-size:11px;padding:5px}.micro{bottom:29%}.poem{font-size:14px}}@media(prefers-reduced-motion:reduce){.mist,.breath{animation:none}}
</style><main><div class="mount"></div><div class="mount two"></div><div class="floor"></div><div class="mist"></div><canvas id="fog" class="fog"></canvas><div class="mat"></div><div class="lamp" id="lamp"></div><div id="objects"></div><header><strong>城 市 山 隐</strong><nav><button id="sound">静音</button><button data-page="trees">我的树</button><button data-page="about">关于</button></nav></header><div id="valley"><div class="poem">山里没有催促。<br>风从石边过去。</div><div class="micro" id="micro"><button id="water">拨溪水</button><button id="leaf">扫落叶</button><button id="light">点灯</button></div><div class="plant" id="plant">离开前，种一棵树。 <button id="plantBtn">种下</button><button id="skip">下次再说</button></div><div class="controls"><span id="clock"></span><button id="duration">12 分钟</button><button id="share">存一张图</button><button id="sit">坐下</button></div></div><section class="panel" id="about"><h2>这里没有需要回答的话。</h2><p>当前是离线山谷。影子与雾气均为本地画面，没有真实在线人数。</p><p>灯与树只保存在这台设备。这里不需要账户。</p><button data-page="valley">返回山谷</button></section><section class="panel" id="trees"><h2>我的树</h2><div id="treeList"></div><button data-page="valley">返回山谷</button></section><div class="hint" id="hint"></div></main><script>
const $=id=>document.getElementById(id),key='city-hermitage-static-trees';let seated=false,lit=localStorage.getItem('city-lamp')==='on',trees=(()=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}})(),start=0,minutes=12,bell=false,ctx=null,sound=false;function tone(f=440,len=.4){if(!sound)return;ctx??=new AudioContext();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.025;g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+len);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+len)}function render(){ $('lamp').classList.toggle('on',lit);$('light').textContent=lit?'熄灯':'点灯';$('micro').classList.toggle('visible',seated);$('sit').textContent=seated?'起身':'坐下';$('objects').innerHTML=trees.map((t,i)=>'<span class="tree" style="left:'+(14+t.x*72)+'%;font-size:'+(18+Math.min(5,1+Math.floor((Date.now()-t.time)/86400000))*5)+'px">♠</span>').join('')+(seated?'<div class="breath"></div><div class="sitter"></div>':'');$('treeList').innerHTML=trees.length?trees.map(t=>'<p>一棵树 · 第 '+(1+Math.floor((Date.now()-t.time)/86400000))+' 天</p>').join(''):'<p>山里还没有你的树。</p>'}function page(p){['valley','about','trees'].forEach(x=>$(x).style.display=x===p?'block':'none');if(p==='valley')$('valley').style.display='block';$('about').classList.toggle('visible',p==='about');$('trees').classList.toggle('visible',p==='trees')}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));$('sit').onclick=()=>{seated=!seated;if(seated){start=Date.now();bell=false;$('plant').classList.remove('visible')}else{$('clock').textContent='';$('plant').classList.add('visible')}render()};$('light').onclick=()=>{lit=!lit;localStorage.setItem('city-lamp',lit?'on':'off');tone(440);render()};$('water').onclick=()=>{const e=document.createElement('div');e.className='rip';$('objects').append(e);setTimeout(()=>e.remove(),1700);tone(660)};$('leaf').onclick=()=>{const e=document.createElement('div');e.className='leaf';$('objects').append(e);setTimeout(()=>e.remove(),1700);tone(220)};$('plantBtn').onclick=()=>{trees.push({time:Date.now(),x:Math.random()});localStorage.setItem(key,JSON.stringify(trees));$('plant').classList.remove('visible');$('hint').textContent='树留在这里了。';render()};$('skip').onclick=()=>$('plant').classList.remove('visible');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'声音开':'静音';if(sound)tone(330)};$('duration').onclick=()=>{minutes=minutes===12?25:12;$('duration').textContent=minutes+' 分钟'};setInterval(()=>{if(!seated)return;const sec=Math.floor((Date.now()-start)/1000);$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec>=minutes*60&&!bell){tone(260,3);bell=true;$('hint').textContent='钟声落在山后。'}},1000);$('share').onclick=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1600;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,1600);g.addColorStop(0,'#0e1416');g.addColorStop(.7,'#3f5b4e');g.addColorStop(1,'#0e1416');x.fillStyle=g;x.fillRect(0,0,1080,1600);x.fillStyle='#c1d0c4';x.font='52px serif';x.fillText('城市山隐',100,180);x.fillText('风从石边过去。',100,1260);const a=document.createElement('a');a.href=c.toDataURL();a.download='城市山隐.png';a.click()};const cv=$('fog'),g=cv.getContext('2d');function fog(t){cv.width=innerWidth;cv.height=innerHeight;g.clearRect(0,0,cv.width,cv.height);for(let i=0;i<3;i++){const x=cv.width*(.35+.1*Math.sin(t*.00008+i)),y=cv.height*(.4+i*.13),r=cv.width*.6,z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,'#9ab7a00d');z.addColorStop(1,'#9ab7a000');g.fillStyle=z;g.fillRect(0,0,cv.width,cv.height)}setTimeout(()=>{if(!document.hidden)requestAnimationFrame(fog)},80)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestAnimationFrame(fog)});requestAnimationFrame(fog);render();page('valley');if('serviceWorker' in navigator && window.isSecureContext){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></html>
